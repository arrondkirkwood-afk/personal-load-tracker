<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Refresh Oilfield Load &amp; Workday Tracker</title>
  <meta name="theme-color" content="#12343b">
  <meta http-equiv="Cache-Control" content="no-cache">
  <style>
    :root {
      color-scheme: light;
      --accent: #12343b;
      --accent-soft: #e4eef0;
      --text: #172226;
      --muted: #617177;
      --line: #d8e0e3;
      --surface: #ffffff;
      --page: #eef2f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 420px);
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 16px 40px rgba(18, 52, 59, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.3rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    button,
    a {
      min-height: 44px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
    }

    button {
      border: 0;
      color: #ffffff;
      background: var(--accent);
    }

    a {
      margin-top: 10px;
      border: 1px solid var(--line);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .status {
      min-height: 24px;
      margin-top: 14px;
      font-size: 0.92rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <h1>Refreshing app files</h1>
    <p>This refreshes the installed app screen without clearing saved loads, settings, Firebase records, or offline data.</p>
    <button id="repair-button" type="button">Refresh App Files</button>
    <a href="index.html?v=1.18.0">Open Tracker</a>
    <p class="status" id="repair-status" aria-live="polite">Starting safe refresh...</p>
  </main>

  <script>
    (function () {
      var appVersion = '1.18.0';
      var cachePrefix = 'personal-oilfield-load-tracker-';
      var status = document.getElementById('repair-status');
      var button = document.getElementById('repair-button');

      function setStatus(message) {
        if (status) {
          status.textContent = message;
        }
      }

      function clearAppFileCaches() {
        if (!window.caches || !caches.keys) {
          return Promise.resolve();
        }

        return caches.keys().then(function (cacheNames) {
          return Promise.all(cacheNames
            .filter(function (cacheName) {
              return cacheName.indexOf(cachePrefix) === 0;
            })
            .map(function (cacheName) {
              return caches.delete(cacheName);
            }));
        });
      }

      function unregisterServiceWorkers() {
        if (!navigator.serviceWorker || !navigator.serviceWorker.getRegistrations) {
          return Promise.resolve();
        }

        return navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(registrations.map(function (registration) {
            return registration.unregister().catch(function () {
              return false;
            });
          }));
        });
      }

      function refreshAppFiles() {
        if (button) {
          button.disabled = true;
        }

        setStatus('Refreshing app files only...');

        return clearAppFileCaches()
          .then(unregisterServiceWorkers)
          .then(function () {
            setStatus('Done. Opening the updated tracker...');
            window.location.replace('index.html?v=' + appVersion + '&refreshed=' + Date.now());
          })
          .catch(function () {
            setStatus('Opening the updated tracker...');
            window.location.replace('index.html?v=' + appVersion + '&refreshed=' + Date.now());
          });
      }

      if (button) {
        button.addEventListener('click', refreshAppFiles);
      }

      window.setTimeout(refreshAppFiles, 400);
    }());
  </script>
</body>
</html>
