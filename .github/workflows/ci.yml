name: Personal Load Tracker CI

on:
  push:
    branches:
      - main
      - agent/load-tracker-export-cleanup
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check export module syntax
        run: node --check export-cleanup.js

      - name: Check export integration syntax
        run: node --check export-integration.js

      - name: Run regression tests
        run: node tests/regression.test.js

      - name: Run clean export tests
        run: node tests/export-cleanup.test.js

      - name: Run export integration tests
        run: node tests/export-integration.test.js
