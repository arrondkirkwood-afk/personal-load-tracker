name: Personal Load Tracker CI

on:
  push:
    branches:
      - main
      - agent/load-tracker-ui-redesign
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check clean export syntax
        run: |
          node --check export-cleanup.js
          node --check export-integration.js

      - name: Run regression tests
        run: node tests/regression.test.js

      - name: Run redesign contract guardrails
        run: node tests/redesign-contract.test.js

      - name: Run clean export tests
        run: node tests/export-cleanup.test.js

      - name: Run export integration tests
        run: node tests/export-integration.test.js

  one_time_over_short_fix:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Trigger signed over-short correction via CI'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply over-short sign correction
        run: python scripts/fix-over-short-signs.py

      - name: Validate corrected app and workbooks
        run: |
          node --check script.js
          node --check professional-export.js
          node --check complete-workbook-export.js
          node tests/regression.test.js
          node tests/professional-export.test.js
          node tests/complete-workbook-export.test.js
          node tests/export-cleanup.test.js

      - name: Commit corrected files
        run: |
          git config user.name "Arrond Load Tracker Automation"
          git config user.email "actions@users.noreply.github.com"
          git add script.js professional-export.js complete-workbook-export.js tests/regression.test.js service-worker.js index.html manifest.json README.md
          git commit -m "Correct overage and shortage sign convention"
          git push
