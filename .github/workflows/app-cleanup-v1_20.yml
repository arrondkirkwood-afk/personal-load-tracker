name: One-time v1.20 app cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run v1.20 app cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.20 cleanup
        run: python scripts/app-cleanup-v1_20.py

      - name: Validate updated app
        run: |
          node --check script.js
          node --check timesheet.js
          node --check daily-closeout.js
          node --check paycheck-reconciliation.js
          node --check export-cleanup.js
          node --check professional-export.js
          node --check complete-workbook-export.js
          node --check export-integration.js
          node tests/regression.test.js
          node tests/redesign-contract.test.js
          node tests/timesheet.test.js
          node tests/export-cleanup.test.js
          node tests/export-integration.test.js
          node tests/professional-export.test.js
          node tests/complete-workbook-export.test.js

      - name: Commit v1.20 cleanup
        run: |
          git checkout -- .github/workflows/ci.yml
          git config user.name "Arrond Load Tracker Automation"
          git config user.email "actions@users.noreply.github.com"
          git add script.js index.html manifest.json README.md repair.html timesheet.js tests/timesheet.test.js tests/regression.test.js tests/redesign-contract.test.js
          git commit -m "Release Load Tracker v1.20.0 cleanup and reconciliation"
          git push
